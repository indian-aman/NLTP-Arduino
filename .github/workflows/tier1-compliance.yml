name: Tier-1 Standards, Security & Compliance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kat-and-sanitizers:
    name: NIST/IETF KATs + ASan/UBSan + CMake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Strict C99 + ASan/UBSan KAT & 30% Loss Encrypted Loopback
        run: |
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -O2 -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -DNLTP_NO_MALLOC -Isrc \
              tests/test_kat_vectors.c src/nltp_core.c src/nltp_net.c src/nltp_sha256.c \
              -o build_kat_full
          ./build_kat_full
          rm -f build_kat_full

      - name: Ultra-Light 4,760B NLTP_TX_ONLY=1 Sensor Profile + ASan/UBSan
        run: |
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -O2 -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -DNLTP_TX_ONLY=1 -DNLTP_NO_MALLOC -Isrc \
              tests/test_kat_vectors.c src/nltp_core.c src/nltp_net.c src/nltp_sha256.c \
              -o build_kat_txonly
          ./build_kat_txonly
          rm -f build_kat_txonly

      - name: Standalone CMake + CTest Verification
        run: |
          cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake
          ctest --test-dir build-cmake --output-on-failure
          rm -rf build-cmake

  fuzzing:
    name: libFuzzer + ASan/UBSan (500k Frames)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure Clang libFuzzer runtime
        run: |
          if ! echo 'int LLVMFuzzerTestOneInput(const unsigned char *d, unsigned long s){(void)d;(void)s;return 0;}' | \
               clang -x c - -fsanitize=fuzzer -o /tmp/fcheck 2>/dev/null; then
            sudo apt-get update
            LLVM_VER=$(clang --version | sed -n 's/.*version \([0-9]*\).*/\1/p' | head -n 1)
            sudo apt-get install -y "libclang-rt-${LLVM_VER}-dev" || sudo apt-get install -y clang
          fi
          rm -f /tmp/fcheck

      - name: Run 500,000 Adversarial Radio Frames under ASan/UBSan
        run: |
          clang -std=c99 -Wall -Wextra -Wpedantic -Werror -Wno-unused-function -O2 -g \
                -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
                -DNLTP_NO_MALLOC -Isrc \
                fuzz/fuzz_nltp_rx.c src/nltp_core.c src/nltp_net.c src/nltp_sha256.c \
                -o fuzz_nltp_rx
          ./fuzz_nltp_rx -runs=500000 -max_len=1400 -print_final_stats=1
          rm -f fuzz_nltp_rx

  misra-and-static-analysis:
    name: Cppcheck & MISRA C:2012 Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Cppcheck Strict C99 Static Analysis
        run: |
          cppcheck --std=c99 \
                   --enable=warning,style,performance,portability \
                   --inline-suppr \
                   --suppress=unusedFunction \
                   --suppress=missingIncludeSystem \
                   --suppress=constParameterPointer \
                   --suppress=constVariablePointer \
                   --suppress=variableScope \
                   --suppress=knownConditionTrueFalse \
                   --error-exitcode=1 \
                   -DNLTP_NO_MALLOC -Isrc \
                   src/nltp_core.c src/nltp_net.c src/nltp_sha256.c

      - name: MISRA C:2012 Rule Scan & Audit Artifact Generation
        run: |
          cppcheck --std=c99 --dump -DNLTP_NO_MALLOC -Isrc \
                   src/nltp_core.c src/nltp_net.c src/nltp_sha256.c
          MISRA_PY=$(find /usr -name misra.py | head -n 1)
          echo "Using MISRA addon: ${MISRA_PY}"
          python3 "${MISRA_PY}" src/nltp_core.c.dump src/nltp_net.c.dump src/nltp_sha256.c.dump > raw_misra.txt 2>&1 || true
          rm -f src/*.dump src/*.ctu-info

          python3 - << 'PY'
          from collections import Counter
          from pathlib import Path

          lines = [ln.strip() for ln in Path("raw_misra.txt").read_text().splitlines() if "[misra-c2012-" in ln]
          counts = Counter()
          for ln in lines:
              tag = ln.split("[")[-1].rstrip("]")
              counts[tag] += 1

          report = [
              "# MISRA C:2012 Automated CI Audit Summary",
              "",
              "- **Target:** `src/nltp_core.c`, `src/nltp_net.c`, `src/nltp_sha256.c`, `src/nltp_wire.h` (`-std=c99 -DNLTP_NO_MALLOC`)",
              "- **Dynamic Heap Calls (`Dir 4.12` / `Rule 21.3`):** `0`",
              "- **Floating-Point Instructions:** `0`",
              "- **Recursive Functions (`Rule 17.2`):** `0`",
              "- **Deviation Register:** See `docs/MISRA_C_2012_COMPLIANCE.md`",
              "",
              "## Rule Finding Distribution (Covered by Documented Deviations)",
              "",
              "| MISRA C:2012 Rule Tag | Occurrences |",
              "| :--- | ---: |",
          ]
          for rule, n in sorted(counts.items(), key=lambda kv: (-kv[1], kv[0])):
              report.append(f"| `{rule}` | {n} |")
          if not counts:
              report.append("| *(zero findings)* | 0 |")
          report.append("")
          Path("misra-c-2012-audit-report.md").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY
          rm -f raw_misra.txt

      - name: Upload MISRA C:2012 Audit Report Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: misra-c-2012-audit-report
          path: |
            misra-c-2012-audit-report.md
            docs/MISRA_C_2012_COMPLIANCE.md
          retention-days: 30

  sbom-and-provenance:
    name: SPDX/CycloneDX SBOM Verification & SLSA Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify SPDX 2.3 & CycloneDX 1.5 SBOM SHA-256 Hashes
        run: |
          python3 - << 'PY'
          import hashlib, json
          from pathlib import Path

          spdx = json.loads(Path("sbom.spdx.json").read_text())
          cdx = json.loads(Path("sbom.cdx.json").read_text())
          assert spdx["spdxVersion"] == "SPDX-2.3"
          assert cdx["bomFormat"] == "CycloneDX" and cdx["specVersion"] == "1.5"

          src_files = sorted(Path("src").glob("*"))
          assert len(spdx["files"]) == len(src_files), "SPDX file count mismatch"
          assert len(cdx["components"]) == len(src_files), "CycloneDX component count mismatch"

          for entry in spdx["files"]:
              p = Path(entry["fileName"].lstrip("./"))
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              recorded = [c["checksumValue"] for c in entry["checksums"] if c["algorithm"] == "SHA256"][0]
              assert actual == recorded, f"SPDX SHA-256 mismatch for {p}: {actual} != {recorded}"

          for comp in cdx["components"]:
              p = Path(comp["name"])
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              recorded = [h["content"] for h in comp["hashes"] if h["alg"] == "SHA-256"][0]
              assert actual == recorded, f"CycloneDX SHA-256 mismatch for {p}: {actual} != {recorded}"

          print(f"Verified SHA-256 digests for all {len(src_files)} source files in SPDX 2.3 and CycloneDX 1.5 SBOMs.")
          PY

      - name: Package Release Bundle
        run: |
          mkdir -p dist
          tar -czf dist/nltp-c99-v1.6.0.tar.gz \
              src examples CMakeLists.txt idf_component.yml \
              library.json library.properties keywords.txt \
              README.md SECURITY.md CONTRIBUTING.md LICENSE \
              sbom.spdx.json sbom.cdx.json \
              spec/draft-bains-nltp-00.txt spec/draft-bains-nltp-00.xml

      - name: Upload Release & SBOM Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nltp-v1.6.0-sbom-bundle
          path: |
            dist/nltp-c99-v1.6.0.tar.gz
            sbom.spdx.json
            sbom.cdx.json
          retention-days: 30

      - name: Attest SLSA Build Provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/nltp-c99-v1.6.0.tar.gz
            sbom.spdx.json
            sbom.cdx.json
